spring:
  application:
    name: ToDo-App
    base-url: http://localhost:8080
  datasource:
    url: jdbc:h2:mem:todo-app
    username: sa
    password: admin
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: DEBUG
      springframework:
        security: DEBUG
