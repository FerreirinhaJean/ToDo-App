spring:
  application:
    name: ToDo-App
  datasource:
    url: jdbc:postgresql://localhost:5432/todo-app
    username: admin
    password: admin
    driver-class_name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: DEBUG
      springframework:
        security: DEBUG
